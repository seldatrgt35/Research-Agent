services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RESEARCH_AGENT_ENVIRONMENT: ${RESEARCH_AGENT_ENVIRONMENT:-local}
      RESEARCH_AGENT_DEBUG: ${RESEARCH_AGENT_DEBUG:-false}
      RESEARCH_AGENT_LOGGING__LEVEL: ${RESEARCH_AGENT_LOGGING__LEVEL:-INFO}
      RESEARCH_AGENT_LOGGING__FORMAT: ${RESEARCH_AGENT_LOGGING__FORMAT:-plain}
      RESEARCH_AGENT_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-research_agent}:${POSTGRES_PASSWORD:-research_agent}@db:5432/${POSTGRES_DB:-research_agent}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_agent}
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

